<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KYBR Records Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Chakra+Petch:wght@600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: one phone shell centered on a dark aubergine ground; every screen is a CD object inside it. Single dark look by design. */
:root{
  --ground:#15121b; --panel:#1a1622; --deep:#100d15; --screen:#150f1f;
  --ink:#e9e4f0; --ink2:rgba(233,228,240,.66); --ink3:rgba(233,228,240,.48);
  --skin:#C084FF; --skin-lo:#e7c8ff; --skin-hi:#7a3fd0;
  --ember:#FFB45E; --ember2:#FF8A3D; --lcd:#5fd8ff; --lcd2:#9fefff; --lcdtext:#dffaff; --green:#7CFFC2; --pink:#ff6fae;
  --paper:#f3ecdd; --paper2:#ebe2ce; --ballpoint:#23307a; --sharpie:#1d1b4f; --sticker:#ffe27a;
  --display:'Michroma',ui-sans-serif,system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --badge:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(130% 80% at 12% -10%,#2b2236,var(--panel) 52%) fixed,var(--ground);color:var(--ink);font-family:var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--lcd);outline-offset:2px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{width:min(392px,100%);height:min(812px,calc(100dvh - 90px));min-height:600px;border-radius:50px;padding:11px;
  background:linear-gradient(155deg,#48424f 0%,#2a2530 32%,#16131b 100%);
  box-shadow:0 44px 80px -20px rgba(0,0,0,.72),inset 0 2px 1px rgba(255,255,255,.16),inset 0 -3px 6px rgba(0,0,0,.5)}
.screen{position:relative;height:100%;border-radius:40px;overflow:hidden;background:linear-gradient(180deg,#1c1822,#15111c);display:flex;flex-direction:column}
@media (max-width:430px){.phone{border-radius:34px;padding:7px}.screen{border-radius:28px}}
.note{max-width:392px;font-size:11px;line-height:1.55;color:var(--ink3);text-align:center;margin:0}
.status{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 26px 8px;font-size:11px;letter-spacing:.5px}
.status b{font-weight:500;display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;color:var(--ink2)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--skin);box-shadow:0 0 8px var(--skin)}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 12px 14px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

/* chrome text */
.chrome{font-family:var(--display);background:linear-gradient(180deg,#fff,#e3e4ec 26%,#9a9bae 50%,#74758a 53%,#cfd0db 76%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.darkchrome{font-family:var(--display);background:linear-gradient(180deg,#5d5f69,#2a2c33 50%,#14151a 52%,#4b4d56);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.ember{color:var(--ember);text-shadow:0 0 8px rgba(255,138,61,.55);letter-spacing:1px}
.word{color:var(--ink2);font-size:10px}

/* nav tray (spec §5) */
.tray{flex:none;display:flex;gap:6px;padding:7px;margin:0 10px 12px;border-radius:18px;background:linear-gradient(180deg,#2a2533,#171320);box-shadow:inset 0 2px 6px rgba(0,0,0,.66),inset 0 -1px 0 rgba(255,255,255,.05)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:12px;
  background:linear-gradient(180deg,#dcdee4,#b6b8c1 46%,#8e909c 54%,#b2b4be);border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -2px 3px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4);transition:transform .12s,filter .12s}
.tab:hover{filter:brightness(1.06);transform:translateY(-1px)}
.tab .led{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9a9ca6,#5f616c);box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}
.tab span{font-size:8px;letter-spacing:1.2px;color:rgba(38,33,48,.64);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.tab.on{background:linear-gradient(180deg,#f5f6f9,#d3d5dd 46%,#a8aab5 54%,#ced0d9);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.28),0 3px 5px rgba(0,0,0,.45)}
.tab.on .led{background:radial-gradient(circle at 40% 35%,var(--skin-lo),var(--skin) 70%);box-shadow:0 0 9px var(--skin),inset 0 0 2px rgba(255,255,255,.8)}
.tab.on span{color:#2a2433;text-shadow:0 1px 0 rgba(255,255,255,.6)}

/* animations */
@keyframes kybrSpin{to{transform:rotate(360deg)}}
@keyframes kybrEq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes kybrFlick{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes kybrRise{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes kybrPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,94,.6)}50%{box-shadow:0 0 0 6px rgba(255,180,94,0)}}
@keyframes kybrFlip{0%{transform:rotateX(0);opacity:1}44%{transform:rotateX(34deg);opacity:.25}60%{transform:rotateX(-22deg);opacity:.5}100%{transform:rotateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* discs */
.disc{position:relative;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle,#2a1f3a,#46326b 46%,#211633 76%)}
.disc::before{content:"";position:absolute;inset:-12%;background:conic-gradient(from 0deg,#c9a6ff,#8fd9ff,#ffb3e6,#ffe6a8,#a8ffd1,#bfa6ff,#8fd9ff,#ffb3e6,#c9a6ff);mix-blend-mode:screen;opacity:.58;animation:kybrSpin 9s linear infinite}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#160f20 0 14%,#8a76b8 15% 24%,transparent 25%),repeating-radial-gradient(circle,transparent 0 2px,rgba(255,255,255,.12) 2px 3px)}
.disc.dark{background:radial-gradient(circle,#26272e,#3a3b44 50%,#1d1e24 78%)}
.disc.dark::before{opacity:0;animation:none}
.cdr{position:relative;border-radius:50%;flex:none;background:conic-gradient(from 30deg,#d9dce3,#f6f7f9,#b9bcc6,#eef0f4,#c9ccd5,#e9ebef,#d9dce3);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.6)}
.cdr::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,var(--screen) 0 40%,#c6c9d2 42% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cdr .sh{position:absolute;left:10%;right:10%;top:12%;text-align:center;font-family:var(--hand);font-weight:600;color:var(--sharpie);font-size:13px;line-height:1;transform:rotate(-6deg)}
.cdr .sh2{position:absolute;left:14%;right:14%;bottom:13%;text-align:center;font-family:var(--hand);color:var(--sharpie);font-size:11px;line-height:1;transform:rotate(-4deg)}

/* covers */
.cover{position:relative;border-radius:2px;overflow:hidden;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:7%;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.cover .ct{font-family:var(--display);font-size:max(6px,.09em);letter-spacing:1px;text-transform:uppercase;line-height:1.3}
.cover .ca{font-size:max(6px,.075em);opacity:.8;margin-top:2px}
.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.28) 30%,transparent 42%,rgba(255,255,255,.14) 68%,transparent 78%),linear-gradient(0deg,rgba(220,230,255,.08),rgba(220,230,255,.08));border:1px solid rgba(255,255,255,.35);pointer-events:none}

/* spines */
.spine{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:2px;margin-bottom:3px;text-align:left;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.5)}
.spine .st{flex:1;min-width:0;font-family:var(--display);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine .sy{flex:none;font-size:9px;opacity:.8}
.spine .ss{flex:none;font-size:10px}

/* generic */
.sec{margin-top:16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;border:1.5px solid #0c0d12;
  background:radial-gradient(circle at 35% 30%,var(--skin-lo),var(--skin) 55%,var(--skin-hi))}
.key{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,255,255,.5);color:#2a2433;font-size:10px;letter-spacing:1.5px;
  background:linear-gradient(180deg,#f5f6f9,#d3d5dd 46%,#a8aab5 54%,#ced0d9);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.28),0 3px 5px rgba(0,0,0,.45)}
.key.hot{background:linear-gradient(180deg,#ffd6a8,#FFB45E 50%,#FF8A3D 52%,#ffb872);border-color:rgba(255,220,180,.7);color:#3a1a05}
.key.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);box-shadow:none}
.key:disabled{opacity:.45}
.tap{border:0;background:none;padding:0;text-align:left}
.list-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 6px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:none;text-align:left}
.list-btn:last-child{border-bottom:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* WIRE */
.storehead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}
.open{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;color:var(--green)}
.open i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.roundcard{margin-top:12px;border-radius:12px;padding:12px;background:linear-gradient(180deg,#d9dbe1,#bcbec7 42%,#a4a6b0 58%,#cfd1d8);box-shadow:inset 0 2px 2px rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.32),0 6px 16px rgba(0,0,0,.4)}
.lcd{position:relative;border-radius:7px;padding:10px 12px;background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 9px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38,0 0 0 3px #6b6d77;overflow:hidden;color:var(--lcd2)}
.lcd::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(95,216,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd > *{position:relative}
.glow{text-shadow:0 0 7px rgba(95,216,255,.7)}
.ticker{display:flex;align-items:stretch;width:100%;margin-top:12px;min-height:46px;padding:0;border:0;text-align:left;border-radius:7px;overflow:hidden;background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 9px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38,0 0 0 3px #6b6d77;position:relative}
.ticker::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(95,216,255,.05) 0 1px,transparent 1px 3px);pointer-events:none;z-index:2}
.ticker .tkl{flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--display);font-size:8px;letter-spacing:1.5px;color:#3a1a05;background:linear-gradient(180deg,#ffd6a8,#FFB45E 50%,#FF8A3D 52%,#ffb872);z-index:3}
.ticker .tkl i{width:6px;height:6px;border-radius:50%;background:#c42a1a;box-shadow:0 0 6px #ff4d3d;animation:kybrFlick 1.2s ease-in-out infinite}
.ticker .tkw{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.ticker .tk{display:flex;white-space:nowrap;animation:kybrTick var(--tkdur,22s) linear infinite;font-family:var(--display);font-size:10px;letter-spacing:1.5px;color:var(--lcd2);text-shadow:0 0 7px rgba(95,216,255,.7)}
.ticker:hover .tk,.ticker:focus-visible .tk{animation-play-state:paused}
.ticker .tk span{padding-right:28px}
.ticker .tk b{font-weight:400;color:var(--ember);text-shadow:0 0 7px rgba(255,138,61,.6)}
.ticker .tk em{font-style:normal;color:var(--green);text-shadow:0 0 7px rgba(124,255,194,.6)}
@keyframes kybrTick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tkhint{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:var(--ink3);margin-top:7px;padding:0 2px}
.holdrow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.holdrow::-webkit-scrollbar{display:none}
.hold{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.hold small{font-size:9px;color:var(--ink2);text-align:center;line-height:1.3}
.pickrow{display:flex;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:none;text-align:left;align-items:flex-start}
.pickrow .take{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4}
.fab{position:absolute;right:20px;bottom:96px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,220,180,.7);font-family:var(--display);font-size:8px;letter-spacing:1px;color:#3a1a05;
  background:radial-gradient(circle at 40% 32%,#ffe2bf,#FFB45E 55%,#d76a2a);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 2px 2px rgba(255,255,255,.6);z-index:5}

/* COUNTER */
.counter{margin-top:10px;border-radius:12px;padding:14px 12px;background:linear-gradient(180deg,#3a2f22,#22190f);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.4)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;min-height:46px;border-radius:8px;border:0;padding:0 12px;font:inherit;font-size:13px;color:var(--lcdtext);background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 8px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38}
.ask input::placeholder{color:rgba(159,239,255,.45)}
.divider{font-family:var(--display);font-size:10px;color:var(--ink3);margin:12px 0 6px;padding-left:2px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:4px}

/* RACK */
.rack{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#d9dbe1 0%,#bcbec7 42%,#a4a6b0 58%,#cfd1d8 100%);box-shadow:inset 0 2px 2px rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.32),0 6px 16px rgba(0,0,0,.4)}
.facehead{display:flex;justify-content:space-between;align-items:center;padding:0 3px}
.model{font-size:8px;letter-spacing:2px;color:#5d5f69}
.spec{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:38px;margin-top:8px}
.spec span{width:5px;border-radius:1px;transform-origin:bottom}
.lcdtitle{font-size:16px;color:var(--lcdtext);text-shadow:0 0 9px rgba(95,216,255,.5);letter-spacing:.5px}
.chip{font-size:8px;letter-spacing:1.5px;padding:2px 6px;border-radius:3px;border:1px solid currentColor}
.component{border-radius:8px;padding:9px;background:linear-gradient(180deg,#2c2d35,#16171d);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6)}
.comphead{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:1.5px;color:#9a9ca6;margin-bottom:8px}
.tray5{display:grid;gap:4px;padding:10px 6px 8px;border-radius:7px;background:radial-gradient(120% 90% at 50% 0%,#1d1e25,#0b0c10);box-shadow:inset 0 2px 8px rgba(0,0,0,.85),inset 0 0 0 1px #34353d}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px 0;border-radius:8px;min-height:44px;min-width:0}
.slot.sel{background:rgba(124,255,194,.08);box-shadow:inset 0 0 0 1px rgba(124,255,194,.35)}
.slot .nm{font-size:9px;color:rgba(233,228,240,.85);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .hs{font-size:8px;min-height:10px;white-space:nowrap}
.slot .disc{box-shadow:0 0 0 2px #0b0c10,0 0 10px rgba(124,255,194,.35)}
.slot .disc.dark{box-shadow:0 0 0 2px #0b0c10}
.slot.mine .disc.dark{box-shadow:0 0 0 2px #0b0c10,0 0 0 3px rgba(255,180,94,.6);animation:kybrPulse 1.8s ease-in-out infinite}
.readout{margin-top:8px;border-radius:6px;padding:8px 10px;background:linear-gradient(180deg,#0e2418,#06120c);box-shadow:inset 0 2px 6px rgba(0,0,0,.8);color:#a8ffcf;font-size:10px;line-height:1.45;min-height:44px}
.readout .q{font-family:var(--hand);font-size:17px;line-height:1.05;color:#d6ffe9}
.transport{display:flex;align-items:center;gap:10px}
.tbtns{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tbtn{height:44px;border-radius:5px;border:0;font-size:12px;color:#4b4d56;background:linear-gradient(180deg,#eceef2,#c2c4cd);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.3)}
.tbtn.g{color:#1f8f5a;background:linear-gradient(180deg,#eaffe9,#bfe6c4)}
.tbtn:active,.jog:active,.key:active,.preset:active{transform:translateY(1px)}
.tbtn:disabled{opacity:.45}
.jog{position:relative;width:64px;height:64px;flex:none;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 42% 34%,#fbfbfd,#cdcfd7 52%,#9a9ca6);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 2px 2px rgba(255,255,255,.9)}
.jog::before{content:"";position:absolute;inset:5px;border-radius:50%;background:conic-gradient(#c7c9d2 0 6deg,#8c8e98 6deg 12deg);opacity:.85}
.jog::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#1a3a52,#0a1826);box-shadow:inset 0 0 8px #3aa0ff,0 0 12px rgba(58,160,255,.55);border:1px solid rgba(95,216,255,.5)}
.jog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;letter-spacing:1px;color:var(--lcd2);text-shadow:0 0 6px #3aa0ff;z-index:1}
.hint{font-size:8px;letter-spacing:1.5px;color:#5d5f69;text-align:center;margin-top:-3px}
.presets{display:flex;gap:7px}
.preset{flex:1;min-width:0;display:flex;align-items:center;gap:7px;min-height:44px;padding:7px;border-radius:7px;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.preset.on{background:rgba(255,111,174,.16);border-color:rgba(255,111,174,.6)}
.preset .n{width:18px;height:18px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:radial-gradient(circle at 38% 30%,#5a5b64,#2c2d35)}
.preset.on .n{background:radial-gradient(circle at 38% 30%,#ffb3d6,#d63d8b);box-shadow:0 0 10px rgba(255,111,174,.7)}
.preset b{display:block;font-weight:400;font-size:10px;color:rgba(233,228,240,.75)}
.preset.on b{color:#ffd0e6}
.preset small{display:block;font-size:8px;color:rgba(233,228,240,.5)}
.well{border-radius:6px;padding:7px 8px;background:linear-gradient(180deg,#15161c,#0c0d12);box-shadow:inset 0 1px 4px rgba(0,0,0,.7),inset 0 0 0 1px #34353d}
.welllbl{font-size:7.5px;letter-spacing:1px;color:#7a7c86;margin-bottom:5px;display:flex;justify-content:space-between}
.vu{display:flex;align-items:flex-end;gap:1.5px;height:18px}
.vu span{flex:1;min-width:2px;border-radius:1px}
.tl{max-height:none}

  return `<div class="sheet metal" role="dialog" aria-label="burn">
   <div class="sheethead"><div><span class="darkchrome" style="font-size:15px">KYBR</span> <span class="model" style="margin-left:6px">CD-RW BURNER · KY·BRN01</span></div>
   <span style="font-size:9px;letter-spacing:1.5px;color:${o.step==='done'?'#1f8f5a':o.step==='burning'?'#c44a1a':'#a06a10'}">● ${o.step==='done'?'DONE':o.step==='burning'?'BUSY':'READY'}</span></div>
   ${stepper}${body}${keys}</div>`;
}
const crewById=id=>CREWS.find(c=>c.id===id)||CREWS[1];
function burnLabel(o){return o.kind==='song'?RECENT[o.song].s:o.kind==='mix'?'mix for '+crewById(o.crew).name:A[o.album].t;}
function oCtrl(){
  return `<div class="sheet" style="background:transparent;padding:12px" role="dialog" aria-label="settings"><div class="autorun">
   <div class="bar"><span>KYBR.EXE · autorun</span><button data-a="close" aria-label="close" style="width:32px;height:28px;border:1px solid rgba(255,255,255,.5);background:#c0c0c0;color:#000;font-size:11px">✕</button></div>
   <div class="body">
    <div class="row" style="gap:14px;margin-bottom:14px"><div class="disc" style="width:64px;height:64px"></div><div><div class="chrome" style="font-size:16px;letter-spacing:2px">KYBR</div><div style="font-size:10px;color:#9fb4e8;margin-top:4px">enhanced CD · v1.0 · insert to begin</div></div></div>
    <div class="lbl" style="color:#9fb4e8">SKIN</div>
    <div class="swatches">${Object.entries(SKINS).map(([k,v])=>`<button class="${S.skin===k?'on':''}" data-a="skin" data-v="${k}" aria-label="${v[0]}" style="background:radial-gradient(circle at 38% 32%,${v[2]},${v[1]} 60%,${v[3]})"></button>`).join('')}</div>
    <button class="arbtn" data-a="svc"><div class="disc ic"></div><span style="flex:1">MUSIC SERVICE<br><small style="color:#9fb4e8">${esc(S.service)} · tap to change</small></span></button>
    <button class="arbtn" data-a="tab" data-v="chnl"><div class="disc ic"></div><span style="flex:1">YOUR CREWS<br><small style="color:#9fb4e8">${CREWS.map(c=>c.name).join(' · ')}</small></span></button>
    <button class="arbtn" data-a="toast" data-v="notifications: a new Burn Club round, something burned for you"><div class="disc ic"></div><span>NOTIFICATIONS</span></button>
    <button class="arbtn" data-a="toast" data-v="signed out (not really, it's a mockup)" style="border-color:rgba(255,120,120,.5)"><div class="disc ic dark"></div><span>SIGN OUT</span></button>
   </div></div></div>`;
}

// ---------- render ----------
const TABS=[['wire','HOME'],['counter','DIG'],['chnl','CREW'],['deck','SHELF'],['case','KEPT']];
function render(keepScroll){
  const v=$('#view');const st=v.scrollTop;
  const fn={wire:vWire,counter:vCounter,chnl:vChnl,deck:vDeck,case:vCase,album:vAlbum}[S.tab];
  v.innerHTML=fn()+(S.tab==='wire'?'':'');
  const fab=document.querySelector('.fab');if(fab)fab.remove();
  if(S.tab==='wire')$('#screen').insertAdjacentHTML('beforeend','<button class="fab" data-a="burn" aria-label="burn something">BURN</button>');
  v.scrollTop=keepScroll?st:0;
  const active=S.tab==='album'?S.from:S.tab;
  $('#tray').innerHTML=TABS.map(([k,l])=>`<button class="tab ${active===k?'on':''}" data-a="tab" data-v="${k}" aria-current="${active===k}"><i class="led"></i><span>${l}</span></button>`).join('');
  const sk=SKINS[S.skin];const r=document.documentElement.style;r.setProperty('--skin',sk[1]);r.setProperty('--skin-lo',sk[2]);r.setProperty('--skin-hi',sk[3]);$('#skinname').textContent=S.tab==='album'?'ALBUM':sk[0];
  renderOv();S.flip=false;
}
function renderOv(){
  const o=S.ov;const box=$('#ov');
  if(!o){box.innerHTML='';return;}
  const html={pick:oPick,hold:oHold,burn:oBurn,ctrl:oCtrl}[o.type](o);
  box.innerHTML=`<div class="scrim" data-a="scrim">${html}</div>`;
}
function openAlbum(id){if(S.tab!=='album')S.from=S.tab;S.album=id;S.tab='album';S.ov=null;render();}

// ---------- events ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='scrim'&&e.target!==el)return;
  switch(a){
   case 'tab': if(el.dataset.crew){S.crew=el.dataset.crew;S.back=0;S.peek=null;} S.tab=v;S.ov=null;render();break;
   case 'album': openAlbum(v);break;
   case 'back': S.tab=S.from;render();break;
   case 'want': S.want.has(S.album)?S.want.delete(S.album):S.want.add(S.album);toast(S.want.has(S.album)?'wrapped · on your shelf to hear later':'off your want list');render(true);break;
   case 'crew': S.crew=v;S.back=0;S.peek=null;render(true);break;
   case 'jog': {const i=CREWS.findIndex(c=>c.id===S.crew);S.crew=CREWS[(i+1)%CREWS.length].id;S.back=0;S.peek=null;render(true);break;}
   case 'older': S.back=Math.min(S.back+1,crew().rounds.length-1);S.peek=null;render(true);break;
   case 'newer': S.back=Math.max(0,S.back-1);S.peek=null;render(true);break;
   case 'peek': S.peek=S.peek===v?null:v;render(true);break;
   case 'dub': toast(`invite code for ${crew().name}: KY-${crew().freq.replace('.','')}-RT · works once, for 7 days`);break;
   case 'song': toast(`opens “${v}” in ${S.service}`);break;
   case 'toast': toast(v);break;
   case 'flip': S.casePage=Math.max(0,S.casePage+Number(v));S.flip=true;render(true);break;
   case 'hold': S.ov={type:'hold',id:v};renderOv();break;
   case 'keep': {const h=S.hold.find(x=>x.id===v);S.kept.unshift({s:h.s,a:h.a,from:nm(h.from),saved:'today'});S.hold=S.hold.filter(x=>x.id!==v);S.ov=null;S.casePage=0;toast('✓ kept · it’s in your binder');render(true);break;}
   case 'ctrl': S.ov={type:'ctrl'};renderOv();break;
   case 'skin': S.skin=v;render(true);S.ov={type:'ctrl'};renderOv();break;
   case 'svc': {const L=['Apple Music','Spotify','YouTube Music','Tidal'];S.service=L[(L.indexOf(S.service)+1)%L.length];renderOv();break;}
   case 'close': S.ov=null;renderOv();break;
   case 'scrim': if(S.ov&&S.ov.type==='burn'&&S.ov.step==='burning')return;S.ov=null;renderOv();break;
   // pick
   case 'pick': {const m=S.my[v];S.ov={type:'pick',album:v,h:m?.h||0,t:m?.t||'',st:m?.st||'',when:'today',re:false};renderOv();break;}
   case 'heat': {const o=S.ov,i=Number(v);o.h=o.h===i?i-.5:o.h===i-.5?i:i;renderOv();break;}
   case 'when': S.ov.when=v;renderOv();break;
   case 're': S.ov.re=!S.ov.re;renderOv();break;
   case 'savepick': savePick();break;
   // burn
   case 'burn': S.ov={type:'burn',step:v?'crew':'what',kind:v?'album':null,album:v||null,song:null,mix:[],crew:S.crew,mode:v?'hold':null,note:'',prog:0};renderOv();break;
   case 'bkind': S.ov.kind=v;renderOv();break;
   case 'bsong': S.ov.song=Number(v);renderOv();break;
   case 'bmix': {const m=S.ov.mix,i=Number(v);const k=m.indexOf(i);k>=0?m.splice(k,1):m.push(i);const sc=document.querySelector('.sheet').scrollTop;renderOv();document.querySelector('.sheet').scrollTop=sc;break;}
   case 'balbum': S.ov.album=v;renderOv();break;
   case 'bcrew': S.ov.crew=v;renderOv();break;
   case 'bmode': S.ov.mode=v;renderOv();break;
   case 'bprev': {const o=S.ov;o.step={item:'what',crew:o.album&&o.kind==='album'&&o.fromAlbum?'what':'item',note:'crew'}[o.step]||'what';renderOv();break;}
   case 'bnext': {const o=S.ov;if(o.step==='note'){burnGo();break;}o.step={what:'item',item:'crew',crew:'note'}[o.step];renderOv();break;}
   case 'burnsee': {const o=S.ov;S.ov=null;S.crew=o.crew;S.back=0;S.tab='chnl';render();break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ask'){S.search=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=vCounter();$('#results').replaceWith(tmp.querySelector('#results'));}
  if(e.target.id==='take'&&S.ov){S.ov.t=e.target.value;$('#cnt').textContent=S.ov.t.length+'/280';}
  if(e.target.id==='stk'&&S.ov)S.ov.st=e.target.value;
  if(e.target.id==='bn'&&S.ov){S.ov.note=e.target.value;$('#bnote').textContent=S.ov.note||'for '+crewById(S.ov.crew).name;}
});
function savePick(){
  const o=S.ov;const first=!S.my[o.album];
  S.my[o.album]={h:o.h,t:o.t.trim()||word(o.h),st:o.st.trim(),when:o.when==='today'?'today':'this week'};
  S.diary=S.diary.filter(([id])=>id!==o.album||o.re);S.diary.unshift([o.album,'nov']);S.want.delete(o.album);
  const rd=isRound(o.album);let msg='✓ posted · on your shelf';
  if(rd){rd.r.logs.you={h:o.h,t:S.my[o.album].t};const c=rd.c;msg=`✓ spun · your disc is lit in ${c.name}`;
    if(Object.keys(rd.r.logs).length>=c.members.length){msg=`✓ round ${rd.r.n} complete · ${nm(rd.r.next)} picks next`;}}
  S.ov=null;toast(first?msg:'✓ take updated');render(true);
}
function burnGo(){
  const o=S.ov;o.step='burning';o.prog=0;renderOv();
  const t=setInterval(()=>{o.prog=Math.min(100,o.prog+7);if(S.ov!==o){clearInterval(t);return;}
    if(o.prog>=100){clearInterval(t);o.step='done';const c=crewById(o.crew);
      if(o.kind==='song')c.tracks.unshift({s:RECENT[o.song].s,a:RECENT[o.song].a,w:'you',when:'now'});
      else if(o.kind==='mix')c.tracks.unshift({s:'mix: '+(o.note||'for '+c.name),a:o.mix.length+' songs on a CD-R',w:'you',when:'now'});
      else if(o.mode==='hold')c.tracks.unshift({s:A[o.album].t+' (album)',a:A[o.album].a,w:'you',when:'now'});
    }
    renderOv();},90);
}
render();
</script>
