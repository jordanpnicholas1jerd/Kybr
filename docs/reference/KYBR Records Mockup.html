<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KYBR Records Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Michroma&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Chakra+Petch:wght@600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: one phone shell centered on a cream paper ground; every screen is a CD object inside it. Poster look: cream paper, ink-black hardware, one cobalt accent. */
:root{
  --ground:#E8DCC6; --panel:#F1E8D6; --deep:#141414; --screen:#141414;
  --ink:#141414; --ink2:rgba(20,20,20,.72); --ink3:rgba(20,20,20,.58);
  --skin:#3F5BA9; --skin-lo:#A9B6E0; --skin-hi:#24346a;
  --ember:#3F5BA9; --ember2:#2c4590; --lcd:#7f98e0; --lcd2:#B9C6EE; --lcdtext:#F1E8D6; --green:#A9B6E0; --pink:#A9B6E0;
  --paper:#f3ecdd; --paper2:#ebe2ce; --ballpoint:#23307a; --sharpie:#1d1b4f; --sticker:#ffe27a;
  --display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --badge:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(130% 80% at 12% -10%,#F7F0E1,var(--panel) 52%) fixed,var(--ground);color:var(--ink);font-family:var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--lcd);outline-offset:2px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{width:min(392px,100%);height:min(812px,calc(100dvh - 90px));min-height:600px;border-radius:50px;padding:11px;
  background:linear-gradient(155deg,#2a2a2a 0%,#141414 40%,#0a0a0a 100%);
  box-shadow:0 44px 80px -20px rgba(0,0,0,.72),inset 0 2px 1px rgba(255,255,255,.16),inset 0 -3px 6px rgba(0,0,0,.5)}
.screen{position:relative;height:100%;border-radius:40px;overflow:hidden;background:#E8DCC6;display:flex;flex-direction:column}
@media (max-width:430px){.phone{border-radius:34px;padding:7px}.screen{border-radius:28px}}
.note{max-width:392px;font-size:11px;line-height:1.55;color:var(--ink3);text-align:center;margin:0}
.status{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 26px 8px;font-size:11px;letter-spacing:.5px}
.status b{font-weight:500;display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;color:var(--ink2)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--skin);box-shadow:0 0 8px var(--skin)}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 12px 14px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

/* chrome text */
.chrome{font-family:var(--display);background:linear-gradient(180deg,#fff,#e3e4ec 26%,#9a9bae 50%,#74758a 53%,#cfd0db 76%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.darkchrome{font-family:var(--display);background:linear-gradient(180deg,#5d5f69,#2a2c33 50%,#14151a 52%,#4b4d56);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.ember{color:var(--ember);text-shadow:0 0 8px rgba(63,91,169,.55);letter-spacing:1px}
.word{color:var(--ink2);font-size:10px}

/* nav tray (spec §5) */
.tray{flex:none;display:flex;gap:6px;padding:7px;margin:0 10px 12px;border-radius:18px;background:linear-gradient(180deg,#1e1e1e,#0c0c0c);box-shadow:inset 0 2px 6px rgba(0,0,0,.66),inset 0 -1px 0 rgba(255,255,255,.05)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:12px;
  background:linear-gradient(180deg,#dcdee4,#b6b8c1 46%,#8e909c 54%,#b2b4be);border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -2px 3px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4);transition:transform .12s,filter .12s}
.tab:hover{filter:brightness(1.06);transform:translateY(-1px)}
.tab .led{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9a9ca6,#5f616c);box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}
.tab span{font-size:8px;letter-spacing:1.2px;color:rgba(38,33,48,.64);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.tab.on{background:linear-gradient(180deg,#f5f6f9,#d3d5dd 46%,#a8aab5 54%,#ced0d9);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.28),0 3px 5px rgba(0,0,0,.45)}
.tab.on .led{background:radial-gradient(circle at 40% 35%,var(--skin-lo),var(--skin) 70%);box-shadow:0 0 9px var(--skin),inset 0 0 2px rgba(255,255,255,.8)}
.tab.on span{color:#141414;text-shadow:0 1px 0 rgba(255,255,255,.6)}

/* animations */
@keyframes kybrSpin{to{transform:rotate(360deg)}}
@keyframes kybrEq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes kybrFlick{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes kybrRise{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes kybrPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,91,169,.6)}50%{box-shadow:0 0 0 6px rgba(63,91,169,0)}}
@keyframes kybrFlip{0%{transform:rotateX(0);opacity:1}44%{transform:rotateX(34deg);opacity:.25}60%{transform:rotateX(-22deg);opacity:.5}100%{transform:rotateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* discs */
.disc{position:relative;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle,#0d1530,#3F5BA9 46%,#0d1530 76%)}
.disc::before{content:"";position:absolute;inset:-12%;background:conic-gradient(from 0deg,#C9D3F2,#8fd9ff,#ffffff,#ffe6a8,#a8ffd1,#A9B6E0,#8fd9ff,#ffffff,#C9D3F2);mix-blend-mode:screen;opacity:.58;animation:kybrSpin 9s linear infinite}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#0b0b0b 0 14%,#A9B6E0 15% 24%,transparent 25%),repeating-radial-gradient(circle,transparent 0 2px,rgba(255,255,255,.12) 2px 3px)}
.disc.dark{background:radial-gradient(circle,#26272e,#3a3b44 50%,#1d1e24 78%)}
.disc.dark::before{opacity:0;animation:none}
.cdr{position:relative;border-radius:50%;flex:none;background:conic-gradient(from 30deg,#d9dce3,#f6f7f9,#b9bcc6,#eef0f4,#c9ccd5,#e9ebef,#d9dce3);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.6)}
.cdr::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,var(--screen) 0 40%,#c6c9d2 42% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cdr .sh{position:absolute;left:10%;right:10%;top:12%;text-align:center;font-family:var(--hand);font-weight:600;color:var(--sharpie);font-size:13px;line-height:1;transform:rotate(-6deg)}
.cdr .sh2{position:absolute;left:14%;right:14%;bottom:13%;text-align:center;font-family:var(--hand);color:var(--sharpie);font-size:11px;line-height:1;transform:rotate(-4deg)}

/* covers */
.cover{position:relative;border-radius:2px;overflow:hidden;flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding:7%;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.cover .ct{font-family:var(--display);font-size:max(6px,.09em);letter-spacing:1px;text-transform:uppercase;line-height:1.3;overflow-wrap:anywhere}
.cover .ca{font-size:max(6px,.075em);opacity:.8;margin-top:2px}
.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.28) 30%,transparent 42%,rgba(255,255,255,.14) 68%,transparent 78%),linear-gradient(0deg,rgba(220,230,255,.08),rgba(220,230,255,.08));border:1px solid rgba(255,255,255,.35);pointer-events:none}

/* spines */
.spine{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:2px;margin-bottom:3px;text-align:left;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.5)}
.spine .st{flex:1;min-width:0;font-family:var(--display);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine .sy{flex:none;font-size:9px;opacity:.8}
.spine .ss{flex:none;font-size:10px}

/* generic */
.sec{margin-top:16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;border:1.5px solid #0c0d12;
  background:radial-gradient(circle at 35% 30%,var(--skin-lo),var(--skin) 55%,var(--skin-hi))}
.key{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,255,255,.5);color:#141414;font-size:10px;letter-spacing:1.5px;
  background:linear-gradient(180deg,#f5f6f9,#d3d5dd 46%,#a8aab5 54%,#ced0d9);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 3px rgba(0,0,0,.28),0 3px 5px rgba(0,0,0,.45)}
.key.hot{background:linear-gradient(180deg,#B9C6EE,#5B74C2 50%,#3F5BA9 52%,#5B74C2);border-color:rgba(169,182,224,.7);color:#ffffff}
.key.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:var(--ink);box-shadow:none}
.key:disabled{opacity:.45}
.tap{border:0;background:none;padding:0;text-align:left}
.list-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 6px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:none;text-align:left}
.list-btn:last-child{border-bottom:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* WIRE */
.storehead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}
.open{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;color:var(--green)}
.open i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.roundcard{margin-top:12px;border-radius:12px;padding:12px;background:linear-gradient(180deg,#d9dbe1,#bcbec7 42%,#a4a6b0 58%,#cfd1d8);box-shadow:inset 0 2px 2px rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.32),0 6px 16px rgba(0,0,0,.4)}
.lcd{position:relative;border-radius:7px;padding:10px 12px;background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 9px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38,0 0 0 3px #6b6d77;overflow:hidden;color:var(--lcd2)}
.lcd::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(127,152,224,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd > *{position:relative}
.glow{text-shadow:0 0 7px rgba(127,152,224,.7)}
.ticker{display:flex;align-items:stretch;width:100%;margin-top:12px;min-height:46px;padding:0;border:0;text-align:left;border-radius:7px;overflow:hidden;background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 9px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38,0 0 0 3px #6b6d77;position:relative}
.ticker::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(127,152,224,.05) 0 1px,transparent 1px 3px);pointer-events:none;z-index:2}
.ticker .tkl{flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--display);font-size:8px;letter-spacing:1.5px;color:#ffffff;background:linear-gradient(180deg,#B9C6EE,#5B74C2 50%,#3F5BA9 52%,#5B74C2);z-index:3}
.ticker .tkl i{width:6px;height:6px;border-radius:50%;background:#3F5BA9;box-shadow:0 0 6px #A9B6E0;animation:kybrFlick 1.2s ease-in-out infinite}
.ticker .tkw{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.ticker .tk{display:flex;white-space:nowrap;animation:kybrTick var(--tkdur,22s) linear infinite;font-family:var(--display);font-size:10px;letter-spacing:1.5px;color:var(--lcd2);text-shadow:0 0 7px rgba(127,152,224,.7)}
.ticker:hover .tk,.ticker:focus-visible .tk{animation-play-state:paused}
.ticker .tk span{padding-right:28px}
.ticker .tk b{font-weight:400;color:var(--ember);text-shadow:0 0 7px rgba(63,91,169,.6)}
.ticker .tk em{font-style:normal;color:var(--green);text-shadow:0 0 7px rgba(169,182,224,.6)}
@keyframes kybrTick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tkhint{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:var(--ink3);margin-top:7px;padding:0 2px}
.holdrow{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.holdrow::-webkit-scrollbar{display:none}
.hold{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.hold small{font-size:9px;color:var(--ink2);text-align:center;line-height:1.3}
.pickrow{display:flex;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:none;text-align:left;align-items:flex-start}
.pickrow .take{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4}
.fab{position:absolute;right:20px;bottom:96px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(169,182,224,.7);font-family:var(--display);font-size:8px;letter-spacing:1px;color:#ffffff;
  background:radial-gradient(circle at 40% 32%,#C9D3F2,#5B74C2 55%,#24346a);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 2px 2px rgba(255,255,255,.6);z-index:5}

/* COUNTER */
.counter{margin-top:10px;border-radius:12px;padding:14px 12px;background:linear-gradient(180deg,#1a1a1a,#0c0c0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.4)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;min-width:0;min-height:46px;border-radius:8px;border:0;padding:0 12px;font:inherit;font-size:13px;color:var(--lcdtext);background:linear-gradient(180deg,#0a1526,#060c18);box-shadow:inset 0 2px 8px rgba(0,0,0,.85),inset 0 0 0 2px #2c2e38}
.ask input::placeholder{color:rgba(185,198,238,.45)}
.divider{font-family:var(--display);font-size:10px;color:var(--ink3);margin:12px 0 6px;padding-left:2px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:4px}

/* RACK */
.rack{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,#d9dbe1 0%,#bcbec7 42%,#a4a6b0 58%,#cfd1d8 100%);box-shadow:inset 0 2px 2px rgba(255,255,255,.85),inset 0 -3px 7px rgba(0,0,0,.32),0 6px 16px rgba(0,0,0,.4)}
.facehead{display:flex;justify-content:space-between;align-items:center;padding:0 3px}
.model{font-size:8px;letter-spacing:2px;color:#5d5f69}
.spec{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:38px;margin-top:8px}
.spec span{width:5px;border-radius:1px;transform-origin:bottom}
.lcdtitle{font-size:16px;color:var(--lcdtext);text-shadow:0 0 9px rgba(127,152,224,.5);letter-spacing:.5px}
.chip{font-size:8px;letter-spacing:1.5px;padding:2px 6px;border-radius:3px;border:1px solid currentColor}
.component{border-radius:8px;padding:9px;background:linear-gradient(180deg,#2c2d35,#16171d);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6)}
.comphead{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:1.5px;color:#9a9ca6;margin-bottom:8px}
.tray5{display:grid;gap:4px;padding:10px 6px 8px;border-radius:7px;background:radial-gradient(120% 90% at 50% 0%,#1d1e25,#0b0c10);box-shadow:inset 0 2px 8px rgba(0,0,0,.85),inset 0 0 0 1px #34353d}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:4px 0;border-radius:8px;min-height:44px;min-width:0}
.slot.sel{background:rgba(169,182,224,.08);box-shadow:inset 0 0 0 1px rgba(169,182,224,.35)}
.slot .nm{font-size:9px;color:rgba(233,228,240,.85);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .hs{font-size:8px;min-height:10px;white-space:nowrap}
.slot .disc{box-shadow:0 0 0 2px #0b0c10,0 0 10px rgba(169,182,224,.35)}
.slot .disc.dark{box-shadow:0 0 0 2px #0b0c10}
.slot.mine .disc.dark{box-shadow:0 0 0 2px #0b0c10,0 0 0 3px rgba(63,91,169,.6);animation:kybrPulse 1.8s ease-in-out infinite}
.readout{margin-top:8px;border-radius:6px;padding:8px 10px;background:linear-gradient(180deg,#0b1226,#060a16);box-shadow:inset 0 2px 6px rgba(0,0,0,.8);color:#C9D3F2;font-size:10px;line-height:1.45;min-height:44px}
.readout .q{font-family:var(--hand);font-size:17px;line-height:1.05;color:#F1E8D6}
.transport{display:flex;align-items:center;gap:10px}
.tbtns{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tbtn{height:44px;border-radius:5px;border:0;font-size:12px;color:#4b4d56;background:linear-gradient(180deg,#eceef2,#c2c4cd);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.3)}
.tbtn.g{color:#1f8f5a;background:linear-gradient(180deg,#eaffe9,#bfe6c4)}
.tbtn:active,.jog:active,.key:active,.preset:active{transform:translateY(1px)}
.tbtn:disabled{opacity:.45}
.jog{position:relative;width:64px;height:64px;flex:none;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 42% 34%,#fbfbfd,#cdcfd7 52%,#9a9ca6);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 2px 2px rgba(255,255,255,.9)}
.jog::before{content:"";position:absolute;inset:5px;border-radius:50%;background:conic-gradient(#c7c9d2 0 6deg,#8c8e98 6deg 12deg);opacity:.85}
.jog::after{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#1a3a52,#0a1826);box-shadow:inset 0 0 8px #3aa0ff,0 0 12px rgba(58,160,255,.55);border:1px solid rgba(127,152,224,.5)}
.jog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;letter-spacing:1px;color:var(--lcd2);text-shadow:0 0 6px #3aa0ff;z-index:1}
.hint{font-size:8px;letter-spacing:1.5px;color:#5d5f69;text-align:center;margin-top:-3px}
.presets{display:flex;gap:7px}
.preset{flex:1;min-width:0;display:flex;align-items:center;gap:7px;min-height:44px;padding:7px;border-radius:7px;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.preset.on{background:rgba(63,91,169,.16);border-color:rgba(63,91,169,.6)}
.preset .n{width:18px;height:18px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:radial-gradient(circle at 38% 30%,#5a5b64,#2c2d35)}
.preset.on .n{background:radial-gradient(circle at 38% 30%,#C9D3F2,#3F5BA9);box-shadow:0 0 10px rgba(63,91,169,.7)}
.preset b{display:block;font-weight:400;font-size:10px;color:rgba(233,228,240,.75)}
.preset.on b{color:#F1E8D6}
.preset small{display:block;font-size:8px;color:rgba(233,228,240,.5)}
.well{border-radius:6px;padding:7px 8px;background:linear-gradient(180deg,#15161c,#0c0d12);box-shadow:inset 0 1px 4px rgba(0,0,0,.7),inset 0 0 0 1px #34353d}
.welllbl{font-size:7.5px;letter-spacing:1px;color:#7a7c86;margin-bottom:5px;display:flex;justify-content:space-between}
.vu{display:flex;align-items:flex-end;gap:1.5px;height:18px}
.vu span{flex:1;min-width:2px;border-radius:1px}
.tl{max-height:none}
.tlrow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 3px;border:0;background:none;border-bottom:1px solid rgba(127,152,224,.1);text-align:left}
.tlrow:last-child{border-bottom:0}
.tlrow .no{font-family:var(--display);font-size:9px;width:18px;flex:none;color:rgba(185,198,238,.55)}
.weekbar{display:flex;gap:8px;margin-top:9px}
.weekbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:11px;background:linear-gradient(160deg,rgba(127,152,224,.16),rgba(20,40,60,.5));border:1px solid rgba(127,152,224,.35);font-family:var(--display);font-size:8.5px;letter-spacing:2px;color:var(--lcdtext)}
.badge410{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 11px;border-radius:9px;background:linear-gradient(180deg,#d6342a,#9a1d16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.4)}

/* ALBUM */
.back{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0}
.jewel{position:relative;padding:8px 8px 8px 18px;border-radius:4px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 40%,rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 14px 30px rgba(0,0,0,.55);margin:14px auto 0;width:min(270px,82%)}
.jewel::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:8px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.28) 0 2px,rgba(255,255,255,.06) 2px 5px);border-radius:2px}
.jewel::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 30%);pointer-events:none;border-radius:4px}
.sticker{position:absolute;right:-10px;top:-12px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4b8,var(--sticker) 60%,#e8c24a);color:#3a2a05;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;transform:rotate(9deg);box-shadow:0 4px 10px rgba(0,0,0,.45);z-index:2}
.sticker .s1{font-size:12px;color:#b4321f;letter-spacing:0}
.sticker .s2{font-family:var(--display);font-size:7px;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.sticker .s3{font-size:8.5px;line-height:1.2;margin-top:3px}
.atitle{text-align:center;margin-top:16px}
.atitle h1{margin:0;font-family:var(--display);font-size:16px;letter-spacing:2px;font-weight:400;text-wrap:balance}
.atitle p{margin:5px 0 0;font-size:11px;color:var(--ink2)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .key{flex:1}
.heatline{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:11px}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:168px;scroll-snap-align:start;border-radius:3px;padding:10px 11px 12px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:#2b2416;box-shadow:0 3px 8px rgba(0,0,0,.45);position:relative}
.card::before{content:"";position:absolute;top:-6px;left:50%;width:46px;height:12px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,250,220,.55);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card .who{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#6a5a3a;display:flex;justify-content:space-between;gap:6px}
.card .cs{color:#3F5BA9;font-size:12px;margin-top:4px}
.card .ballpoint{font-family:var(--hand);font-weight:500;font-size:18px;line-height:1.05;color:var(--ballpoint);margin-top:5px}
.card .typed{font-size:11px;line-height:1.45;color:#3a3222;margin-top:5px}
.card.public{background:linear-gradient(180deg,#e9edf2,#d9dfe7)}
.card.mine{box-shadow:0 0 0 2px var(--ember),0 3px 8px rgba(0,0,0,.45)}
.traycard{margin-top:6px;border-radius:3px;background:linear-gradient(180deg,#e9e6df,#d6d2c8);color:#2b2a26;padding:12px 12px 14px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.traycard .tc{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.trk{display:flex;gap:6px;align-items:baseline;width:100%;min-height:32px;padding:4px 0;border:0;background:none;text-align:left;font-size:10.5px;color:#2b2a26;border-bottom:1px dotted rgba(0,0,0,.18)}
.trk i{font-style:normal;font-size:9px;color:#7a766b;width:16px;flex:none}
.trk.cur{color:#b4321f}
.barcode{margin-top:10px;height:22px;width:90px;background:repeating-linear-gradient(90deg,#222 0 1px,transparent 1px 3px,#222 3px 5px,transparent 5px 6px,#222 6px 7px,transparent 7px 9px)}
.openin{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.openin button{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:9.5px;letter-spacing:1px;color:var(--ink2)}

/* DECK */
.badgecard{display:flex;gap:12px;align-items:stretch;margin-top:6px}
.nametag{flex:1;min-width:0;border-radius:8px;overflow:hidden;background:#f2f2f2;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.nametag .top{background:var(--skin-hi);color:#fff;text-align:center;padding:6px 0 5px;font-family:var(--display);font-size:9px;letter-spacing:3px}
.nametag .nm{padding:10px 12px 4px;text-align:center;font-family:var(--badge);font-weight:600;font-size:24px;letter-spacing:4px;color:#141414}
.nametag .hd{text-align:center;font-size:10px;color:#6b6478;padding-bottom:10px}
.gear{flex:none;width:52px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#1e1e1e,#0c0c0c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px;letter-spacing:1px;color:var(--ink2)}
.gear .cdicon{width:22px;height:22px}
.radio{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:linear-gradient(180deg,#c2c6d0 0%,#9aa0ac 30%,#6a6f7c 50%,#525762 51%,#7a808c 70%,#aeb4c0 100%);box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.7),inset 0 -4px 8px rgba(0,0,0,.4)}
.radio .g{flex:1;min-width:0;border-radius:6px;padding:7px 9px;background:linear-gradient(180deg,#0b1226,#060a16);box-shadow:inset 0 2px 6px rgba(0,0,0,.8);color:#C9D3F2;font-size:11px}
.knob{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:radial-gradient(circle at 40% 32%,var(--skin-lo),var(--skin) 55%,var(--skin-hi));box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.6);color:#ffffff;font-size:13px}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;margin-top:4px}
.eq span{width:4px;background:#A9B6E0;transform-origin:bottom;animation:kybrEq 1.4s ease-in-out infinite}
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-radius:6px;background:linear-gradient(180deg,#1a1a1a,#0e0e0e);box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.wall button{border:0;background:none;padding:0;min-width:0}
.wall .cover{width:100%;aspect-ratio:1;max-width:100%}
.month{font-size:9px;letter-spacing:2px;color:var(--ink3);margin:10px 0 5px;text-transform:uppercase}
.wantrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.wantrow button{border:0;background:none;padding:0;flex:none}

/* CASE */
.binder{margin-top:10px;border-radius:12px;padding:10px;background:linear-gradient(180deg,#1a1a1a,#0c0c0c);box-shadow:inset 0 2px 8px rgba(0,0,0,.7);perspective:900px}
.sleeve{display:flex;gap:12px;align-items:center;padding:12px 8px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);min-height:150px}
.sleeve.flip{animation:kybrFlip .55s ease}
.rings{display:flex;justify-content:space-around;padding:8px 6px}
.rings span{width:14px;height:22px;border-radius:7px;border:3px solid #b9bcc6;border-left-color:#7c7f8a;border-bottom-color:#8a8d97;background:transparent}
.bigcd{width:118px;height:118px;border-radius:50%;flex:none;position:relative;background:conic-gradient(from 210deg,#E8DCC6,#c9d8f7,#c9f7e4,#f7f0c9,#f7d8c9,#C9D3F2,#c9e8f7,#E8DCC6);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.bigcd::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,rgba(255,255,255,.18) 2px 3px)}
.bigcd::after{content:"";position:absolute;inset:39%;border-radius:50%;background:radial-gradient(circle,var(--screen) 0 35%,var(--skin) 37% 100%);box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.flipbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.flipbar .key{min-width:56px}

/* overlays */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(8,6,12,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:16px 14px 22px;animation:kybrRise .32s ease;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.metal{background:linear-gradient(180deg,#d9dbe1 0%,#bcbec7 42%,#a4a6b0 58%,#cfd1d8 100%);box-shadow:inset 0 2px 2px rgba(255,255,255,.85);color:#141414}
.sheet.paper{background:linear-gradient(180deg,#1a1a1a,#0e0e0e)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.35);font-size:14px}
.sheet.paper .x{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink)}
.heatcells{display:flex;gap:2px}
.heatcells button{width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;padding:0;color:var(--ember);position:relative}
.heatcells button .off{opacity:.22}
.heatcells .half{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pickcard{border-radius:4px;padding:14px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:#2b2416;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pickcard textarea{width:100%;min-height:120px;border:0;resize:vertical;background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(35,48,122,.16) 25px 26px);font-family:var(--hand);font-size:20px;line-height:26px;color:var(--ballpoint);padding:0;margin-top:6px}
.pickcard textarea:focus{outline:none}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field input[type=text]{min-height:44px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);padding:0 11px;font:inherit;font-size:12px;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);font-size:10px;letter-spacing:1px;color:var(--ink2)}
.seg button.on{border-color:var(--ember);color:var(--ember);background:rgba(63,91,169,.1)}
.steps{display:flex;gap:6px;margin:4px 0 12px}
.steps span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8px;letter-spacing:1.5px;color:#5d5f69}
.steps i{width:8px;height:8px;border-radius:50%;background:#7b7d87;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.steps .done i{background:#46e06a;box-shadow:0 0 6px #46e06a}
.steps .cur i{background:#ffb02e;box-shadow:0 0 6px #ffb02e}
.choice{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 10px;border-radius:8px;margin-bottom:6px;text-align:left;color:var(--lcdtext);background:rgba(255,255,255,.03);border:1px solid rgba(127,152,224,.18)}
.choice.on{background:rgba(63,91,169,.16);border-color:rgba(63,91,169,.6);color:#F1E8D6}
.choice small{display:block;color:rgba(185,198,238,.6);font-size:9px;margin-top:2px}
.cap{height:12px;border-radius:3px;background:#0b1220;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);overflow:hidden;margin-top:6px}
.cap span{display:block;height:100%;background:linear-gradient(90deg,#46e06a,#ffd23d 80%,#ff4d4d)}
.prog{height:8px;border-radius:4px;background:#0b1220;overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--ember);box-shadow:0 0 8px var(--ember)}
.keys{display:flex;gap:8px;margin-top:12px}
.keys .key{flex:1}

/* autorun */
.autorun{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1b2a4a,#0c1324 60%,#1a1030);box-shadow:inset 0 0 0 1px rgba(150,190,255,.25),0 20px 40px rgba(0,0,0,.6);color:#dfe8ff}
.autorun .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:linear-gradient(90deg,#0a1f8c,#1466c8 70%,#3a8fdf);font-size:10px;letter-spacing:1px}
.autorun .body{padding:14px}
.arbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;margin-bottom:8px;border-radius:26px;border:1px solid rgba(180,210,255,.35);text-align:left;color:#eef3ff;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 50%,rgba(0,0,0,.15) 51%,rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.arbtn .ic{width:28px;height:28px;flex:none}
.swatches{display:flex;gap:8px;margin:4px 0 12px}
.swatches button{width:44px;height:44px;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;max-width:86%;padding:9px 14px;border-radius:8px;background:linear-gradient(180deg,#0b1226,#060a16);color:#C9D3F2;font-size:11px;box-shadow:0 0 0 1px rgba(169,182,224,.35),0 8px 20px rgba(0,0,0,.6);animation:kybrRise .25s ease;text-align:center}

/* labels, booklets, likes */
.bk{display:flex;gap:12px;width:100%;padding:12px;margin-bottom:8px;border:0;border-radius:4px;text-align:left;background:linear-gradient(180deg,var(--paper),var(--paper2));color:#2b2416;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.bkt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.bkl{font-family:var(--display);font-size:7.5px;letter-spacing:1.5px;color:#7a5a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkh{font-size:14px;line-height:1.3;font-weight:500;text-wrap:balance}
.bks{font-size:10px;color:#6a5a3a}.bks .ember{color:#3F5BA9;text-shadow:none}
.bkm{font-size:10px;color:#6a5a3a;margin-top:2px}
.lk{min-height:32px;padding:0 9px;border-radius:16px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.35);font-size:10.5px;color:#5a3a1a}
.lk.on{color:#3F5BA9;border-color:rgba(196,42,26,.45);background:rgba(255,200,190,.5)}
.cardfoot{display:flex;gap:6px;margin-top:9px}
.cardfoot.dark .lk{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--ink2)}
.cardfoot.dark .lk.on{color:#ff8a7a;border-color:rgba(255,120,100,.5);background:rgba(255,80,60,.12)}
.nmb{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#6a5a3a;min-height:24px;text-decoration:underline;text-decoration-color:rgba(106,90,58,.35);text-underline-offset:2px}
.nmb2{font-size:12px;color:var(--ink);min-height:24px;text-decoration:underline;text-decoration-color:rgba(233,228,240,.3);text-underline-offset:2px}
.card.wide{width:100%}
.mast{margin-top:6px;padding:14px;border-radius:10px;background:radial-gradient(120% 120% at 0% 0%,#24346a,#0d1530);box-shadow:inset 0 0 0 1px rgba(169,182,224,.2),0 8px 18px rgba(0,0,0,.45)}
.mastn{font-family:var(--badge);font-weight:600;font-size:22px;letter-spacing:2px;line-height:1.15;background:linear-gradient(180deg,#fff,var(--skin-lo));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.tagc{font-size:10px;padding:4px 9px;border-radius:12px;border:1px solid rgba(63,91,169,.45);color:var(--ember)}
.subbtn{flex:none;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--ember);background:linear-gradient(180deg,#B9C6EE,#5B74C2 50%,#3F5BA9 52%,#5B74C2);color:#ffffff;font-size:9px;letter-spacing:1.2px}
.subbtn.on{background:transparent;color:var(--ember)}
.subbtn.big{min-height:44px}
.lcard{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:9px;letter-spacing:1px;color:#fff;background:radial-gradient(circle at 38% 30%,var(--skin-lo),var(--skin) 55%,var(--skin-hi));box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.logo.sm{width:34px;height:34px;font-size:8px}
.reader{margin-top:12px;border-radius:4px;padding:16px 16px 20px;background:linear-gradient(180deg,#f7f2e6,#efe7d4);color:#2b2416;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.rcover{border-radius:2px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.rlabel{display:flex;gap:10px;align-items:center;margin-top:14px;min-height:44px;text-align:left;color:#2b2416}
.rlabel b{font-weight:500;font-size:12px}.rlabel small{font-size:10px;color:#7a6a4a}
.reader h1{font-family:var(--mono);font-weight:500;font-size:21px;line-height:1.25;margin:12px 0 6px;text-wrap:balance}
.ralbum{font-size:11px;color:#6a5a3a;min-height:32px;text-align:left}
.rst{color:#3F5BA9;letter-spacing:1px}
.reader p{font-size:13px;line-height:1.75;margin:12px 0 0}
.rfav{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rfav span{font-size:10px;padding:4px 8px;border-radius:3px;background:rgba(0,0,0,.06)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ractions .lk{min-height:40px;font-size:12px}
.cmhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px}
.cmhead .seg button{min-height:32px;padding:0 10px}
.cm{padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.cmt{font-size:12px;line-height:1.5;color:var(--ink2);margin-top:3px}
.cmnew{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cmnew textarea{min-height:70px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);padding:9px 11px;font:inherit;font-size:12px;color:var(--ink);resize:vertical}
.cmnew .key{align-self:flex-end}
.sel,.wbt{width:100%;min-height:44px;border-radius:7px;font:inherit;font-size:12px}
.sel{border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:var(--ink);padding:0 10px}
.wbt{border:0;border-bottom:1px solid rgba(35,48,122,.25);background:transparent;color:#2b2416;font-size:16px;font-weight:500;padding:0}
.wbt:focus{outline:none}
.wbb{width:100%;min-height:180px;border:0;resize:vertical;background:transparent;font:inherit;font-size:13px;line-height:1.7;color:#2b2416;margin-top:4px;padding:0}
.wbb:focus{outline:none}
.toast{bottom:96px}
.empty{font-size:11px;color:var(--ink3);padding:10px 4px;line-height:1.5}

/* ---- poster theme overrides ---- */
*{font-stretch:125%}
body{background:var(--ground)}

}

// ---------- events ----------
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='scrim'&&e.target!==el)return;
  switch(a){
   case 'tab': if(el.dataset.crew){S.crew=el.dataset.crew;S.back=0;S.peek=null;} if(v==='deck')S.labelOf='you'; S.tab=v;S.navTab=v;S.ov=null;render();break;
   case 'label': S.labelOf=v;S.tab='deck';S.navTab='deck';S.ov=null;render();break;
   case 'like': S.liked.has(v)?S.liked.delete(v):S.liked.add(v);if(S.ov)S.ov.keep=true;render(true);break;
   case 'take': S.ov={type:'take',key:v,album:el.dataset.album};renderOv();break;
   case 'sub': {const on=S.subs.has(v);on?S.subs.delete(v):S.subs.add(v);toast(on?`unsubscribed from ${lab(v).n}`:`✓ subscribed · ${lab(v).n} lands on your HOME`);if(S.ov)S.ov.keep=true;render(true);break;}
   case 'dig': S.digMode=v;S.search='';render(true);break;

   case 'comment': {const t=$('#cmt').value.trim();if(!t){toast('write something first');break;}(S.cm[v]=S.cm[v]||[]).push({by:'you',t,likes:0});S.cmSort='new';toast('✓ comment posted');if(S.ov)S.ov.keep=true;render(true);break;}
   case 'reply': {const t=$('#rp').value.trim();if(!t){toast('write something first');break;}(S.replies[v]=S.replies[v]||[]).push({by:'you',t,h:S.ov.h||0});S.ov.h=0;S.ov.keep=true;toast('✓ replied · only your crew sees it');render(true);break;}
   case 'write': S.ov={type:'write',album:v||S.diary[0][0],h:(v&&S.my[v]?.h)||0,title:'',body:''};renderOv();break;
   case 'publish': {const o=S.ov;const paras=o.body.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);const b={id:'b'+Date.now(),by:'you',album:o.album,title:o.title.trim()||A[o.album].t,h:o.h,when:'just now',likes:0,fav:[],body:paras.length?paras:['(no words yet)']};BOOKLETS.unshift(b);
     if(!S.my[o.album]){S.my[o.album]={h:o.h,t:b.title,st:'',when:'today'};S.diary.unshift([o.album,'nov']);}S.ov=null;S.bkFrom=S.tab;S.bk=b.id;S.tab='booklet';toast('✓ published · on your label');render();break;}
   case 'bk': if(S.tab!=='booklet')S.bkFrom=S.tab;S.bk=v;S.tab='booklet';S.ov=null;render();break;
   case 'bkback': S.tab=S.bkFrom;render();break;
   case 'album': openAlbum(v);break;
   case 'back': S.tab=S.from;render();break;
   case 'want': S.want.has(S.album)?S.want.delete(S.album):S.want.add(S.album);toast(S.want.has(S.album)?'wrapped · on your shelf to hear later':'off your want list');render(true);break;
   case 'crew': S.crew=v;S.back=0;S.peek=null;render(true);break;
   case 'jog': {const i=CREWS.findIndex(c=>c.id===S.crew);S.crew=CREWS[(i+1)%CREWS.length].id;S.back=0;S.peek=null;render(true);break;}
   case 'older': S.back=Math.min(S.back+1,crew().rounds.length-1);S.peek=null;render(true);break;
   case 'newer': S.back=Math.max(0,S.back-1);S.peek=null;render(true);break;
   case 'peek': S.peek=S.peek===v?null:v;render(true);break;
   case 'dub': toast(`invite code for ${crew().name}: KY-${crew().freq.replace('.','')}-RT · works once, for 7 days`);break;
   case 'song': toast(`opens “${v}” in ${S.service}`);break;
   case 'toast': toast(v);break;
   case 'flip': S.casePage=Math.max(0,S.casePage+Number(v));S.flip=true;render(true);break;
   case 'hold': S.ov={type:'hold',id:v};renderOv();break;
   case 'keep': {const h=S.hold.find(x=>x.id===v);S.kept.unshift({s:h.s,a:h.a,from:nm(h.from),saved:'today'});S.hold=S.hold.filter(x=>x.id!==v);S.ov=null;S.casePage=0;toast('✓ kept · it’s in your binder');render(true);break;}
   case 'ctrl': S.ov={type:'ctrl'};renderOv();break;
   case 'skin': S.skin=v;render(true);S.ov={type:'ctrl'};renderOv();break;
   case 'svc': {const L=['Apple Music','Spotify','YouTube Music','Tidal'];S.service=L[(L.indexOf(S.service)+1)%L.length];renderOv();break;}
   case 'close': S.ov=null;renderOv();break;
   case 'scrim': if(S.ov&&S.ov.type==='burn'&&S.ov.step==='burning')return;S.ov=null;renderOv();break;
   // pick
   case 'pick': {const m=S.my[v];S.ov={type:'pick',album:v,h:m?.h||0,t:m?.t||'',st:m?.st||'',when:'today',re:false};renderOv();break;}
   case 'heat': {const o=S.ov,i=Number(v);o.h=o.h===i?i-.5:o.h===i-.5?i:i;o.keep=true;renderOv();break;}
   case 'when': S.ov.when=v;renderOv();break;
   case 're': S.ov.re=!S.ov.re;renderOv();break;
   case 'savepick': savePick();break;
   // burn
   case 'burn': S.ov={type:'burn',step:v?'crew':'what',kind:v?'album':null,album:v||null,song:null,mix:[],crew:S.crew,mode:v?'hold':null,note:'',prog:0};renderOv();break;
   case 'bkind': S.ov.kind=v;renderOv();break;
   case 'bsong': S.ov.song=Number(v);renderOv();break;
   case 'bmix': {const m=S.ov.mix,i=Number(v);const k=m.indexOf(i);k>=0?m.splice(k,1):m.push(i);const sc=document.querySelector('.sheet').scrollTop;renderOv();document.querySelector('.sheet').scrollTop=sc;break;}
   case 'balbum': S.ov.album=v;renderOv();break;
   case 'bcrew': S.ov.crew=v;renderOv();break;
   case 'bmode': S.ov.mode=v;renderOv();break;
   case 'bprev': {const o=S.ov;o.step={item:'what',crew:o.album&&o.kind==='album'&&o.fromAlbum?'what':'item',note:'crew'}[o.step]||'what';renderOv();break;}
   case 'bnext': {const o=S.ov;if(o.step==='note'){burnGo();break;}o.step={what:'item',item:'crew',crew:'note'}[o.step];renderOv();break;}
   case 'burnsee': {const o=S.ov;S.ov=null;S.crew=o.crew;S.back=0;S.tab='chnl';render();break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='ask'){S.search=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=vCounter();$('#results').replaceWith(tmp.querySelector('#results'));}
  if(e.target.id==='take'&&S.ov){S.ov.t=e.target.value;$('#cnt').textContent=S.ov.t.length+'/280';}
  if(e.target.id==='stk'&&S.ov)S.ov.st=e.target.value;
  if(e.target.id==='wbTitle'&&S.ov)S.ov.title=e.target.value;
  if(e.target.id==='wbBody'&&S.ov)S.ov.body=e.target.value;
  if(e.target.id==='wbAlbum'&&S.ov)S.ov.album=e.target.value;
  if(e.target.id==='rp')$('#rpc').textContent=e.target.value.length+'/250';
  if(e.target.id==='bn'&&S.ov){S.ov.note=e.target.value;$('#bnote').textContent=S.ov.note||'for '+crewById(S.ov.crew).name;}
});
function savePick(){
  const o=S.ov;const first=!S.my[o.album];
  S.my[o.album]={h:o.h,t:o.t.trim()||word(o.h),st:o.st.trim(),when:o.when==='today'?'today':'this week'};
  S.diary=S.diary.filter(([id])=>id!==o.album||o.re);S.diary.unshift([o.album,'nov']);S.want.delete(o.album);
  const rd=isRound(o.album);let msg='✓ posted · on your shelf';
  if(rd){rd.r.logs.you={h:o.h,t:S.my[o.album].t};const c=rd.c;msg=`✓ spun · your disc is lit in ${c.name}`;
    if(Object.keys(rd.r.logs).length>=c.members.length){msg=`✓ round ${rd.r.n} complete · ${nm(rd.r.next)} picks next`;}}
  S.ov=null;toast(first?msg:'✓ take updated');render(true);
}
function burnGo(){
  const o=S.ov;o.step='burning';o.prog=0;renderOv();
  const t=setInterval(()=>{o.prog=Math.min(100,o.prog+7);if(S.ov!==o){clearInterval(t);return;}
    if(o.prog>=100){clearInterval(t);o.step='done';const c=crewById(o.crew);
      if(o.kind==='song')c.tracks.unshift({s:RECENT[o.song].s,a:RECENT[o.song].a,w:'you',when:'now'});
      else if(o.kind==='mix')c.tracks.unshift({s:'mix: '+(o.note||'for '+c.name),a:o.mix.length+' songs on a CD-R',w:'you',when:'now'});
      else if(o.mode==='hold')c.tracks.unshift({s:A[o.album].t+' (album)',a:A[o.album].a,w:'you',when:'now'});
    }
    renderOv();},90);
}
render();
</script>
